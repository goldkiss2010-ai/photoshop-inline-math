name: Photoshop source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fonttools==4.67.0
      - run: python tools/run_partial_integration_tests.py
      - run: python tools/prepare_uxp_package.py --check-ccx plugin/PaperMath.ccx
      - run: python tools/build_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperMath-Windows-preview
          path: local-build/PaperMath-Windows-preview.zip
  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install fonttools==4.67.0
      - run: python -m unittest discover -s tests -p test_distribution_setup.py -v
      - run: python -m unittest discover -s tests -p test_plugin_installer.py -v
